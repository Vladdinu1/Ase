<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Formular</title>
</head>
<body>
    <header>
        <h1><center>Formular de inscriere</center></h1>
            </header>
  <style>
    .contact-form {
      background-color: #fff;
      padding: 25px;
      border-radius: 8px;
      max-width: 800px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .contact-form h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
    }

    button {
      background-color: #e12790;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #e12760;
    }
  </style>
</head>
<body>

<center><h3>Completati acest formular pentru inscriere</center></h3>



  <div class="contact-form">
    <h2>Introduceti datele personale:</h2>
    <form action="/inscriere" method="POST">
      <div class="form-group">
        <label for="nume">Nume și prenume:</label>
        <input type="text" id="nume" name="nume" required>
      </div>
      <div class="form-group">
        <label for="telefon">Număr de telefon:</label>
        <input type="tel" id="telefon" name="telefon" pattern="[0-9]{10}" required>
      </div>
      <div class="form-group">
        <label for="email">Adresă de email:</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="mesaj">Crezi ca am putea imbunatatii ceva? Give us some feedback!</label>
        <textarea id="mesaj" name="mesaj" rows="5" required></textarea>
      </div>
      <div class="form-group" style="text-align: center;">
        <button type="submit">Trimite</button>
      </div>
    </form>
  </div>

</body>
</html>
